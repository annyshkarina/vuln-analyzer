name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install package
        run: |
          pip install --upgrade pip
          pip install .

      - name: Run simple test
        run: |
          python -c "from vuln_analyzer.analyzer import analyze_code; print(analyze_code('char buf[10]; gets(buf);'))"